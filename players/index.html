<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joueurs · Utilitaires CS2</title>
  <link rel="stylesheet" href="/library/gallery.css">
  <link rel="stylesheet" href="/players/players.css">
  <script defer src="/players/players.js"></script>
</head>
<body>
  <main class="players-page">
    <header><h1>Joueurs</h1></header>
    <p id="players-empty" class="player-message" role="status">Chargement des cartes…</p>
    <div id="player-workspace" class="player-workspace" hidden>
      <section class="panel player-controls" aria-labelledby="heatmap-title">
        <h2 id="heatmap-title">Heatmap des positions</h2>
        <div class="player-filters">
          <label for="player-map">Carte <select id="player-map"></select></label>
          <label for="player-round">Round <select id="player-round"></select></label>
          <label for="player-floor" id="player-floor-control" hidden>Niveau
            <select id="player-floor"><option value="upper">Haut</option><option value="lower">Bas</option></select>
          </label>
        </div>
        <div class="player-timer">
          <div class="player-timer-heading">
            <button id="player-play" class="zone-button" type="button" disabled>Lire</button>
            <output id="player-remaining" for="player-time" aria-live="off">1:55,0</output>
          </div>
          <input id="player-time" type="range" min="0" max="1150" step="1" value="0" aria-label="Temps restant dans le round" disabled>
          <div class="player-time-bounds" aria-hidden="true"><span id="player-duration">1:55</span><span>0:00</span></div>
        </div>
        <div class="player-legend" aria-label="Côtés">
          <span class="player-terrorists">T</span>
          <span class="player-counter-terrorists">CT</span>
        </div>
        <p id="player-coverage" class="player-message" role="status"></p>
      </section>
      <section class="panel player-map-panel" aria-label="Radar des positions">
        <div class="player-radar">
          <img id="player-radar-image" alt="" draggable="false">
          <canvas id="player-heatmap" width="512" height="512" aria-hidden="true"></canvas>
          <p id="player-map-status" class="player-map-status" hidden></p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
